# params.yaml -- single source of truth for every tunable knob in the pipeline.
#
# DVC reads this file and substitutes ${...} references into the commands in
# dvc.yaml. Nothing here is read by the Python scripts directly, so the existing
# argparse interfaces stay exactly as they are -- you can still run any script
# by hand with explicit flags.
#
# Change a value here -> `dvc repro` reruns only the stages that depend on it.

# ---------------------------------------------------------------------------
# Paths. All relative to the repo root, because DVC always executes from there.
# ---------------------------------------------------------------------------
paths:
  # Raw inputs (DVC-tracked via `dvc add`, not produced by any stage)
  raw_image_dir: data/raw/images
  raw_mask_dir: data/raw/masks

  # Intermediate + processed data (stage outputs)
  manifest: data/interim/manifest.csv
  corrected_mask_dir: data/processed/masks_corrected
  splits_dir: data_pipeline/splits

  # Training artifacts. These four MUST be siblings, never nested: DVC rejects
  # a tracked output that lives inside another stage's tracked output.
  checkpoint_dir: training/checkpoints                       # train stage
  tune_checkpoint_dir: training/checkpoints_tune             # tune (untracked, transient)
  capacity_checkpoint_dir: training/checkpoints_capacity     # capacity arms
  loss_checkpoint_dir: training/checkpoints_loss             # loss ablation arms
  batching_checkpoint_dir: training/checkpoints_batching     # batching arms
  mlflow_db: training/mlflow.db
  study_db: training/optuna_study.db

  # Evaluation + serving artifacts
  metrics_dir: metrics
  exported_model_dir: deployment/exported_model

# ---------------------------------------------------------------------------
# Stage: audit (mask correction + stratified split)
# ---------------------------------------------------------------------------
audit:
  min_dim: 32                     # drop pair if min(width, height) <= this
  # Applied to the ORIGINAL mask, before no-data correction -- see the docstring
  # on exclusion_reason(). A mask painted white over a large black border is an
  # annotation defect; correction repairs the border and hides the evidence, so
  # checking the corrected mask misses these entirely.
  # Do NOT lower this. Max corrected coverage on this dataset is 0.980, and
  # values descend smoothly from there, so anything under ~0.98 starts deleting
  # legitimate open-water tiles rather than defects.
  all_white_thresh: 0.995         # drop pair if the original mask is >= this much foreground
  near_black_threshold: 15        # per-pixel RGB sum below this = no-data
  near_black_exclude_thresh: 0.7  # drop image if this fraction is no-data
  val_frac: 0.15
  test_frac: 0.15
  n_buckets: 5                    # size buckets for stratification
  seed: 42

# ---------------------------------------------------------------------------
# Stage: sampling_balance
# ---------------------------------------------------------------------------
sampling:
  n_patches: 2000               # per fg_bias_ratio setting

# ---------------------------------------------------------------------------
# Data loading / sampling (shared by train, tune, evaluate)
# ---------------------------------------------------------------------------
data:
  window_min: 64
  window_max: 2048
  patch_size: 256
  fg_bias_ratio: 0.7
  patches_per_epoch: 8000
  tile_size: 384
  overlap: 0.25
  num_workers: 4

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  encoder_name: mobilenet_v2
  encoder_weights: imagenet
  # nargs=3 flag -- kept as a space-separated string so it expands correctly
  # into the command line. Recalibrate if data.patch_size changes.
  decoder_atrous_rates: "2 4 6"

# ---------------------------------------------------------------------------
# Loss
# ---------------------------------------------------------------------------
loss:
  bce_weight: 0.5
  dice_alpha: 0.5
  dice_beta: 0.5

# ---------------------------------------------------------------------------
# Stage: train
# Values below are Study 2 / Trial 8 -- the config behind the final model.
# ---------------------------------------------------------------------------
train:
  experiment_name: water_body_segmentation
  # Study 2 / Trial 8 -- the config behind the production model. The benchmark
  # grid deliberately does NOT use these; see benchmark.* below.
  lr: 9.18e-05
  weight_decay: 6.10e-04
  dropout: 0.442
  batch_size: 8                 # fixed by the 4GB GPU, not searched
  epochs: 60
  early_stopping_patience: 10
  min_delta: 0.001
  lr_patience: 5
  seed: 42

# ---------------------------------------------------------------------------
# Stage: tune (frozen -- run on demand, not part of a plain `dvc repro`)
# ---------------------------------------------------------------------------
tune:
  # Tuning IS the architecture comparison. A study run to convergence gives each
  # architecture its own optimum, which is the fair basis for comparing them --
  # and Optuna's pruner makes that affordable, since bad trials die at the warmup
  # epoch rather than running the full budget. A separate fixed-hyperparameter
  # benchmark would have been cheaper and less honest.
  #
  # To tune a different architecture: change arch, encoder_name and study_name
  # together, then run the stage. Studies share one storage file, keyed by name,
  # so previous results are preserved.
  arch: deeplabv3plus
  # mit_b0 is load-bearing for segformer: smp defaults it to a resnet34 encoder,
  # which is a SegFormer-style decoder on a CNN, not a transformer.
  encoder_name: mobilenet_v2
  study_name: water_body_tuning_deeplabv3plus_mobilenet_v2

  n_trials: 1
  # A JSON object pins a specific configuration: Optuna runs exactly these values
  # as the next trial instead of sampling them, and an enqueued trial is never
  # pruned -- a deliberately chosen config should run its full budget rather than
  # be cut off against a median it was not competing with.
  # Empty string means sample normally.
  #   enqueue_params: '{"lr": 4.23e-04, "weight_decay": 1.69e-03, "dropout": 0.039}'
  enqueue_params: ""
  epochs: 25
  pruner_startup_trials: 5
  pruner_warmup_epochs: 3

  # Wide by design. The previous range was narrowed around one architecture's
  # answer, which would stop any other architecture finding its own -- and
  # transformers generally want a lower learning rate than CNNs.
  lr_min: 1.0e-05
  lr_max: 1.0e-03
  weight_decay_min: 1.0e-05
  weight_decay_max: 1.0e-01
  # Searched only when the architecture has ASPP; see supports_aspp_dropout().
  dropout_min: 0.0
  dropout_max: 0.5

# ---------------------------------------------------------------------------
# Stage: capacity (frozen -- run on demand)
#
# Answers "dropout at 0.44 instead of shrinking the model or freezing layers".
# Every arm targets the same overfitting, through a different mechanism, at
# otherwise identical settings. Judge on the train/val gap and the epoch where
# val_iou peaks, not on val_iou alone -- these are anti-overfitting
# interventions, so "delays the divergence" is the effect to look for.
# ---------------------------------------------------------------------------
capacity:
  experiment_name: water_body_capacity
  epochs: 30
  variants:
    baseline_dropout_044:
      dropout: 0.442
      freeze_encoder: false
      decoder_channels: null
      seed: 42
    baseline_no_dropout:
      dropout: 0.0
      freeze_encoder: false
      decoder_channels: null
      seed: 42
    frozen_encoder:
      dropout: 0.0
      freeze_encoder: true
      decoder_channels: null
      seed: 42
    small_decoder:
      dropout: 0.0
      freeze_encoder: false
      decoder_channels: 128
      seed: 42

# ---------------------------------------------------------------------------
# Stage: lossablation (frozen -- run on demand)
#
# CAVEAT to state when reporting: the learning rate is tuned for one loss.
# Losses differ in gradient scale -- focal suppresses an easy pixel's gradient
# by ~400x at gamma=2 -- so a fixed lr favours the baseline.
#
# Judge on precision AND recall, not IoU alone: these arms trade FN against FP,
# and the mechanism shows in the split even when IoU barely moves.
# ---------------------------------------------------------------------------
lossablation:
  experiment_name: water_body_loss
  epochs: 30
  variants:
    bce_dice:
      pixel_loss: bce
      pixel_weight: 0.5
      tversky_alpha: 0.5
      tversky_beta: 0.5
      pos_weight: 1.0
      focal_gamma: 2.0
      seed: 42
    # The knob already in the code, finally turned. beta > alpha punishes false
    # negatives -- in THIS codebase alpha is on FP, opposite to the Tversky paper.
    bce_tversky_recall:
      pixel_loss: bce
      pixel_weight: 0.5
      tversky_alpha: 0.3
      tversky_beta: 0.7
      pos_weight: 1.0
      focal_gamma: 2.0
      seed: 42
    # pos_weight is the measured background:foreground ratio, not a guess.
    weighted_bce_dice:
      pixel_loss: weighted_bce
      pixel_weight: 0.5
      tversky_alpha: 0.5
      tversky_beta: 0.5
      pos_weight: 4.4
      focal_gamma: 2.0
      seed: 42
    focal_dice:
      pixel_loss: focal
      pixel_weight: 0.5
      tversky_alpha: 0.5
      tversky_beta: 0.5
      pos_weight: 1.0
      focal_gamma: 2.0
      seed: 42

# ---------------------------------------------------------------------------
# Stage: batching (frozen -- run on demand)
#
# batch16_native vs batch8_accum2 differ in exactly one thing: the sample count
# BatchNorm normalises over. Gradients are mathematically identical.
# ---------------------------------------------------------------------------
batching:
  experiment_name: water_body_batching
  epochs: 30
  variants:
    batch8:
      batch_size: 8
      accum_steps: 1
      seed: 42
    batch16_native:
      batch_size: 16
      accum_steps: 1
      seed: 42
    batch8_accum2:
      batch_size: 8
      accum_steps: 2
      seed: 42
    batch8_accum4:
      batch_size: 8
      accum_steps: 4
      seed: 42

# ---------------------------------------------------------------------------
# Stage: evaluate
# ---------------------------------------------------------------------------
evaluate:
  threshold: 0.5
  batch_size: 8
  num_workers: 0
  num_images: 16                # how many test images to render in the preview