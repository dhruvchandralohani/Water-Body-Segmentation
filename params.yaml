# params.yaml -- single source of truth for every tunable knob in the pipeline.
#
# DVC reads this file and substitutes ${...} references into the commands in
# dvc.yaml. Nothing here is read by the Python scripts directly, so the existing
# argparse interfaces stay exactly as they are -- you can still run any script
# by hand with explicit flags.
#
# Change a value here -> `dvc repro` reruns only the stages that depend on it.

# ---------------------------------------------------------------------------
# Paths. All relative to the repo root, because DVC always executes from there.
# ---------------------------------------------------------------------------
paths:
  # Raw inputs (DVC-tracked via `dvc add`, not produced by any stage)
  raw_image_dir: data/raw/images
  raw_mask_dir: data/raw/masks

  # Intermediate + processed data (stage outputs)
  manifest: data/interim/manifest.csv
  corrected_mask_dir: data/processed/masks_corrected
  splits_dir: data_pipeline/splits

  # Training artifacts. These four MUST be siblings, never nested: DVC rejects
  # a tracked output that lives inside another stage's tracked output.
  checkpoint_dir: training/checkpoints                       # train stage
  tune_checkpoint_dir: training/checkpoints_tune             # tune (untracked, transient)
  benchmark_checkpoint_dir: training/checkpoints_benchmark   # benchmark arms
  capacity_checkpoint_dir: training/checkpoints_capacity     # capacity arms
  loss_checkpoint_dir: training/checkpoints_loss             # loss ablation arms
  batching_checkpoint_dir: training/checkpoints_batching     # batching arms
  mlflow_db: training/mlflow.db
  study_db: training/optuna_study.db

  # Evaluation + serving artifacts
  metrics_dir: metrics
  exported_model_dir: deployment/exported_model

# ---------------------------------------------------------------------------
# Stage: audit (mask correction + stratified split)
# ---------------------------------------------------------------------------
audit:
  min_dim: 32                     # drop pair if min(width, height) <= this
  # Applied to the ORIGINAL mask, before no-data correction -- see the docstring
  # on exclusion_reason(). A mask painted white over a large black border is an
  # annotation defect; correction repairs the border and hides the evidence, so
  # checking the corrected mask misses these entirely.
  # Do NOT lower this. Max corrected coverage on this dataset is 0.980, and
  # values descend smoothly from there, so anything under ~0.98 starts deleting
  # legitimate open-water tiles rather than defects.
  all_white_thresh: 0.995         # drop pair if the original mask is >= this much foreground
  near_black_threshold: 15        # per-pixel RGB sum below this = no-data
  near_black_exclude_thresh: 0.7  # drop image if this fraction is no-data
  val_frac: 0.15
  test_frac: 0.15
  n_buckets: 5                    # size buckets for stratification
  seed: 42

# ---------------------------------------------------------------------------
# Stage: sampling_balance
# ---------------------------------------------------------------------------
sampling:
  n_patches: 2000               # per fg_bias_ratio setting

# ---------------------------------------------------------------------------
# Data loading / sampling (shared by train, tune, evaluate)
# ---------------------------------------------------------------------------
data:
  window_min: 64
  window_max: 2048
  patch_size: 256
  fg_bias_ratio: 0.7
  patches_per_epoch: 8000
  tile_size: 384
  overlap: 0.25
  num_workers: 4

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  encoder_name: mobilenet_v2
  encoder_weights: imagenet
  # nargs=3 flag -- kept as a space-separated string so it expands correctly
  # into the command line. Recalibrate if data.patch_size changes.
  decoder_atrous_rates: "2 4 6"

# ---------------------------------------------------------------------------
# Loss
# ---------------------------------------------------------------------------
loss:
  bce_weight: 0.5
  dice_alpha: 0.5
  dice_beta: 0.5

# ---------------------------------------------------------------------------
# Stage: train
# Values below are Study 2 / Trial 8 -- the config behind the final model.
# ---------------------------------------------------------------------------
train:
  experiment_name: water_body_segmentation
  # Study 2 / Trial 8 -- the config behind the production model. The benchmark
  # grid deliberately does NOT use these; see benchmark.* below.
  lr: 9.18e-05
  weight_decay: 6.10e-04
  dropout: 0.442
  batch_size: 8                 # fixed by the 4GB GPU, not searched
  epochs: 60
  early_stopping_patience: 10
  min_delta: 0.001
  lr_patience: 5
  seed: 42

# ---------------------------------------------------------------------------
# Stage: tune (frozen -- run on demand, not part of a plain `dvc repro`)
# ---------------------------------------------------------------------------
tune:
  n_trials: 30
  study_name: water_body_tuning
  epochs: 15                    # per-trial budget (Study 2 setting)
  pruner_startup_trials: 5
  pruner_warmup_epochs: 3

# ---------------------------------------------------------------------------
# Stage: benchmark (frozen -- run on demand)
#
# Fixed-hyperparameter architecture comparison. Every variant runs at the
# train.* hyperparameters above, the same seed, splits, loss and augmentation.
# That is deliberate and it is the benchmark's main limitation: those
# hyperparameters were tuned on deeplabv3plus_mbv2_recalibrated, so the
# comparison is biased toward it. Say so when reporting the result.
#
# DVC foreach has no cross-product, so multi-seed means duplicate entries
# with different seed values (e.g. unet_mbv2_s7).
# ---------------------------------------------------------------------------
benchmark:
  experiment_name: water_body_arch_benchmark
  epochs: 20                      # arms were still improving at epoch 14 of 15

  # Hyperparameters scoped to this grid, not shared with train.*. Neutral,
  # literature-standard values rather than the Optuna result, which was tuned on
  # DeepLabV3+/MobileNetV2 and would hand that arm a home-field advantage. The
  # price is that no arm sits at its own optimum -- the correct trade for a
  # comparison, and worth stating when reporting it. Keeping them separate also
  # means retuning the grid never invalidates the production train stage.
  lr: 2.0e-04                     # standard AdamW segmentation fine-tuning range
  weight_decay: 0.01              # AdamW canonical; also the SegFormer paper's value
  # 0.0, not 0.442: decoder_aspp_dropout exists only on DeepLabV3+, so any
  # non-zero value regularizes one arm and not the other two.
  dropout: 0.0
  # Equal to the epoch budget so it never fires: a fixed-budget comparison needs
  # every arm to get the same number of epochs. Each still reports its best
  # checkpoint, so nothing overfit is selected. Cosine also needs the full
  # horizon known in advance, which early stopping would cut short.
  early_stopping_patience: 20
  scheduler: cosine               # warmup + cosine; see build_lr_schedule()
  warmup_frac: 0.05               # 1000 of 20000 steps = one epoch of warmup
  variants:
    # Three architecture FAMILIES, encoder and decoder taken as a unit. The
    # encoder cannot be held constant across all three: a MobileNetV2 encoder
    # inside Segformer would not be a transformer, which is the thing being
    # compared. Report parameter counts alongside the scores.
    deeplabv3plus_mbv2:
      arch: deeplabv3plus
      encoder_name: mobilenet_v2
      decoder_atrous_rates: "2 4 6"
      seed: 42
    unet_mbv2:
      arch: unet
      encoder_name: mobilenet_v2
      decoder_atrous_rates: "2 4 6"   # dropped by unet; kept so the grid is uniform
      seed: 42
    # mit_b0 is load-bearing: smp's Segformer defaults to a resnet34 encoder,
    # which would give a SegFormer-style MLP decoder on a CNN -- not a
    # transformer at all.
    segformer_mitb0:
      arch: segformer
      encoder_name: mit_b0
      decoder_atrous_rates: "2 4 6"   # dropped by segformer
      seed: 42

# ---------------------------------------------------------------------------
# Stage: capacity (frozen -- run on demand)
#
# Answers "dropout at 0.44 instead of shrinking the model or freezing layers".
# Every arm targets the same overfitting, through a different mechanism, at
# otherwise identical settings. Judge on the train/val gap and the epoch where
# val_iou peaks, not on val_iou alone -- these are anti-overfitting
# interventions, so "delays the divergence" is the effect to look for.
# ---------------------------------------------------------------------------
capacity:
  experiment_name: water_body_capacity
  epochs: 30                      # longer than the arch benchmark: overfitting
                                  # onset was around epoch 6-7, and the point is
                                  # to see whether each arm moves it
  variants:
    # Current model: high dropout, everything trainable.
    baseline_dropout_044:
      dropout: 0.442
      freeze_encoder: false
      decoder_channels: null
      seed: 42
    # Same capacity, no regularization -- shows what dropout was covering for.
    baseline_no_dropout:
      dropout: 0.0
      freeze_encoder: false
      decoder_channels: null
      seed: 42
    # Fewer trainable parameters instead of noisier ones.
    frozen_encoder:
      dropout: 0.0
      freeze_encoder: true
      decoder_channels: null
      seed: 42
    # Smaller decoder instead of a regularized full-size one.
    small_decoder:
      dropout: 0.0
      freeze_encoder: false
      decoder_channels: 128
      seed: 42

# ---------------------------------------------------------------------------
# Stage: lossablation (frozen -- run on demand)
#
# Answers "BCE+Tversky weights never ablated against focal loss or weighted BCE".
# Every arm keeps the same architecture, data, schedule and seed; only the loss
# changes.
#
# CAVEAT to state when reporting: lr=9.18e-05 was tuned with plain BCE+Dice.
# Losses differ in gradient scale -- focal suppresses an easy pixel's gradient
# by ~400x at gamma=2 -- so a fixed lr favours the baseline. This is a harsher
# version of the same bias in the arch benchmark, because loss scale and lr
# interact directly.
#
# Judge on precision AND recall, not IoU alone: these arms trade FN against FP,
# and the mechanism shows in the split even when IoU barely moves. Baseline is
# precision 0.8574 / recall 0.8480.
# ---------------------------------------------------------------------------
lossablation:
  experiment_name: water_body_loss
  epochs: 30
  variants:
    # Current loss: BCE + Dice (Tversky at the degenerate alpha == beta).
    bce_dice:
      pixel_loss: bce
      pixel_weight: 0.5
      tversky_alpha: 0.5
      tversky_beta: 0.5
      pos_weight: 1.0
      focal_gamma: 2.0
      seed: 42
    # The knob already in the code, finally turned. beta > alpha punishes false
    # negatives -- the recall bias for thin, elongated features. Note the
    # convention: in this codebase alpha is on FP, opposite to the Tversky paper.
    bce_tversky_recall:
      pixel_loss: bce
      pixel_weight: 0.5
      tversky_alpha: 0.3
      tversky_beta: 0.7
      pos_weight: 1.0
      focal_gamma: 2.0
      seed: 42
    # pos_weight is not a guess: it is the measured background:foreground pixel
    # ratio of 4.4 from metrics/class_balance.json.
    weighted_bce_dice:
      pixel_loss: weighted_bce
      pixel_weight: 0.5
      tversky_alpha: 0.5
      tversky_beta: 0.5
      pos_weight: 4.4
      focal_gamma: 2.0
      seed: 42
    focal_dice:
      pixel_loss: focal
      pixel_weight: 0.5
      tversky_alpha: 0.5
      tversky_beta: 0.5
      pos_weight: 1.0
      focal_gamma: 2.0
      seed: 42

# ---------------------------------------------------------------------------
# Stage: batching (frozen -- run on demand)
#
# Answers "batch size 8 accepted as a hardware limit without exploring gradient
# accumulation". The premise is already measured false: batch 8 reserves 1374 MB
# of a 4 GB card and batch 16 runs natively at 2708 MB. So the interesting
# question is not "does accumulation let me exceed 8" but the one these three
# arms isolate:
#
#   batch8            the tuned baseline
#   batch16_native    real batch 16 -- BN sees 16 samples
#   batch8_accum2     effective batch 16 -- identical gradients, BN sees 8
#
# batch16_native vs batch8_accum2 differ in exactly one thing: the sample count
# BatchNorm normalises over. Gradients are mathematically identical. If they
# score the same, accumulation is a free stand-in for a bigger batch on this
# model; if they diverge, BN batch size is doing the work and accumulation
# cannot substitute for it.
#
# effective_batch32 needs accumulation outright -- ~67 MB fixed + ~152 MB per
# sample puts native batch 32 near 4.9 GB, past the card.
#
# CAVEAT: lr 9.18e-05 was tuned at batch 8. Larger effective batches usually
# want a larger lr, so the bigger-batch arms are handicapped at fixed lr.
# ---------------------------------------------------------------------------
batching:
  experiment_name: water_body_batching
  epochs: 30
  variants:
    batch8:
      batch_size: 8
      accum_steps: 1
      seed: 42
    batch16_native:
      batch_size: 16
      accum_steps: 1
      seed: 42
    batch8_accum2:
      batch_size: 8
      accum_steps: 2
      seed: 42
    batch8_accum4:
      batch_size: 8
      accum_steps: 4
      seed: 42

# ---------------------------------------------------------------------------
# Stage: evaluate
# ---------------------------------------------------------------------------
evaluate:
  threshold: 0.5
  batch_size: 8
  num_workers: 0
  num_images: 16                # how many test images to render in the preview
